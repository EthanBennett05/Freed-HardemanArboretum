<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Freed-Hardeman Arboretum</title>
  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/jpeg" href="imgs/Logo.jpeg">
  
  
  <!-- Leaflet SDK -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  
  <!-- Config file (defines window.APP_CONFIG) -->
  <script src="./config.js"></script>
  
  <!-- Main Application Logic -->
  <script src="./index.js"></script>
</head>
<body>
  <!-- 3-line tab: opens and closes the sidebar -->
  <button id="btnMenu" class="menu-tab" type="button" aria-label="Show or hide menu" aria-controls="sidebar" aria-expanded="true">
    <span></span><span></span><span></span>
  </button>

  <!-- Left sidebar: header, toolbar, and tree key -->
  <aside id="sidebar">
    <header>
      <div class="header-top">
        <!-- Brand / Logo -->
        <div class="brand">
          <img src="imgs/Logo.jpeg" alt="Freed-Hardeman Arboretum" class="logo">
          <h2>Freed-Hardeman Arboretum</h2>
        </div>

        <!-- User Auth / Sign Out -->
        <div class="user-auth">
          <button id="btnShowLogin">Admin sign in with Google</button>

          <div id="userProfile" class="user-profile" hidden>
            <img id="userAvatar" class="avatar" src="" alt="Profile Picture">
            <div class="user-details">
              <span id="userLabel"></span>
              <button id="btnSignOut" class="btn-link">Sign out</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Toolbar -->
      <div class="toolbar">
        <button id="btnAddTree" hidden>+ Add Tree</button>
        <button id="btnCancel" hidden>Cancel</button>
        <p id="status" class="status-msg"></p>
      </div>
    </header>

    <section id="key">
      <div class="keyHead">
        <h3>Tree key <span id="keyCount" class="muted"></span></h3>
        <input id="keySearch" type="search" placeholder="Search by ID, species, notes" aria-label="Search trees" />
      </div>
      <div id="keyList"></div>
    </section>
  </aside>

  <!-- Full-page map with the details panel floating on the right -->
  <main>
    <div id="map"></div>

    <aside id="panel">
      <p id="hint" class="muted">Click a tree on the map or in the key to see its details.</p>
      
      <section id="editor" hidden>
        <h3>Tree details</h3>

        <div id="photoStrip" class="photo-strip" hidden></div>
        
        <label for="fTag">ID</label>
        <input id="fTag" type="text" readonly/>

        <label for="fSpecies">Species / name</label>
        <input id="fSpecies" type="text" maxlength="100" autocomplete="off" />

        <label for="fNotes">Notes</label>
        <textarea id="fNotes" rows="3"></textarea>

        <p id="fCoords" class="muted"></p>
        <p id="editorError" class="error"></p>

        <div class="row extras">
          <a id="linkGoogle" class="btn" href="#" target="_blank" rel="noopener noreferrer" hidden>Google it</a>
          <a id="linkImages" class="btn" href="#" target="_blank" rel="noopener noreferrer" hidden>Google Images</a>
          <button id="btnAddPhoto" type="button" hidden>Add photo</button>
          <input id="photoInput" type="file" accept="image/*" multiple hidden />
        </div>

        <div class="row">
          <button id="btnSave">Save</button>
          <button id="btnDelete" class="danger">Delete</button>
          <button id="btnClose">Close</button>
        </div>
        
        <p class="muted" id="dragTip">Tip: drag a marker to move it.</p>
      </section>
    </aside>
  </main>
</body>
</html>
